<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .item {
            background-color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .item img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item h3 {
            margin: 10px 0;
        }

        .item button {
            margin-top: 10px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .item button:hover {
            background-color: #45a049;
        }

        .cart {
            margin-top: 30px;
            text-align: center;
        }

        .cart h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .cart ul {
            list-style-type: none;
            padding: 0;
        }

        .cart li {
            background-color: #ffffff;
            margin: 10px 0;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }

        .cart li div {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart li button {
            padding: 5px 10px;
            background-color: #FF6347;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .checkout {
            margin-top: 20px;
            padding: 10px;
            background-color: #FF6347;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        .checkout:hover {
            background-color: #e5533f;
        }

    </style>
</head>
<body>

<h1>Welcome to the Shopping Cart</h1>

<div class="container">
    <div class="item">
        <img src="https://m.media-amazon.com/images/I/51gXqEXrAEL._AC_UF1000,1000_QL80_.jpg" alt="Dettol Liquid Refill Handwash">
        <h3>Dettol Liquid Refill Handwash (675ml)</h3>
        <button onclick="addToCart('Dettol Liquid Refill Handwash (675ml)')">Add to Cart</button>
    </div>
    <div class="item">
        <img src="https://m.media-amazon.com/images/I/61fQA+kazoL.jpg" alt="Harpic Power Plus Toilet Cleaner (1L)">
        <h3>Harpic Power Plus Toilet Cleaner (1L)</h3>
        <button onclick="addToCart('Harpic Power Plus Toilet Cleaner (1L)')">Add to Cart</button>
    </div>
    <div class="item">
        <img src="https://rukminim2.flixcart.com/image/850/1000/l01blow0/toothbrush/x/s/e/sensitive-soft-bristles-4-pcs-1-colgate-ultra-soft-original-imagbwthrqebzxjh.jpeg?q=90&crop=false" alt="Colgate Toothbrush">
        <h3>Colgate Toothbrush</h3>
        <button onclick="addToCart('Colgate Toothbrush')">Add to Cart</button>
    </div>
    <div class="item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1BTyBQ0jgYNDeYEWQlFdmOSRMc6OAVech1w&s" alt="Lizol Floor Cleaner">
        <h3>Lizol Floor Cleaner (625ml)</h3>
        <button onclick="addToCart('Lizol Floor Cleaner (625ml)')">Add to Cart</button>
    </div>
</div>

<div class="cart">
    <h2>Your Cart</h2>
    <ul id="cartItems">
        <!-- Items will be added here -->
    </ul>
    <button class="checkout" onclick="placeOrder()">Place Order</button>
</div>

<script>
    var cart = {};

    function addToCart(item) {
        // If the item already exists in the cart, increase its quantity
        if (cart[item]) {
            cart[item].quantity++;
        } else {
            // Otherwise, add it to the cart with quantity 1
            cart[item] = { quantity: 1 };
        }
        displayCart();
    }

    function displayCart() {
        var cartItems = document.getElementById('cartItems');
        cartItems.innerHTML = '';
        for (var item in cart) {
            var li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <span>${item} (x${cart[item].quantity})</span>
                    <div>
                        <button onclick="changeQuantity('${item}', -1)">-</button>
                        <button onclick="changeQuantity('${item}', 1)">+</button>
                    </div>
                </div>
            `;
            cartItems.appendChild(li);
        }
    }

    function changeQuantity(item, change) {
        if (cart[item]) {
            cart[item].quantity += change;
            if (cart[item].quantity <= 0) {
                delete cart[item];
            }
            displayCart();
        }
    }

    function placeOrder() {
        if (Object.keys(cart).length > 0) {
            alert('Your order has been placed successfully!');
            cart = {}; // Clear cart
            displayCart(); // Update cart display
        } else {
            alert('Your cart is empty. Please add items to the cart before placing an order.');
        }
    }
</script>

</body>
</html>
