<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Shop</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f2f2;
    }

    header {
      background-color: #007bff;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .search-filter {
      display: flex;
      gap: 10px;
      padding: 15px 30px;
      background: white;
    }

    .search-filter input, .search-filter select {
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      flex: 1;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      padding: 20px 30px;
    }

    .item {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .item:hover {
      transform: translateY(-5px);
    }

    .item img {
      height: 140px;
      object-fit: contain;
      width: 100%;
      margin-bottom: 10px;
    }

    .item h3 {
      font-size: 16px;
      color: #333;
      margin-bottom: 8px;
      height: 50px;
      overflow: hidden;
    }

    .controls {
      margin-top: 10px;
    }

    .controls button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .quantity-controls button {
      padding: 4px 10px;
      font-size: 16px;
    }

    .bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #007bff;
      color: white;
      padding: 15px 30px;
      text-align: right;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
    }

    .bottom-bar button {
      background: white;
      color: #007bff;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
    }

    @media (max-width: 600px) {
      .item h3 {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>🛒 My Store</h1>
</header>

<div class="search-filter">
  <input type="text" placeholder="Search..." oninput="filterItems()" id="searchBox">
  <select onchange="filterItems()" id="categoryFilter">
    <option value="All">All Categories</option>
    <option value="Dishwash Liquids">Dishwash Liquids</option>
    <option value="Floor Cleaners">Floor Cleaners</option>
    <option value="Toilet Cleaners">Toilet Cleaners</option>
    <option value="Oral Care">Oral Care</option>
  </select>
</div>

<div class="container" id="productList">
  <!-- Items will be rendered here -->
</div>

<div class="bottom-bar" id="cartBar">
  <span>Items in cart</span>
  <button onclick="placeOrder()">Place Order</button>
</div>

<script>
  const products = [
    {
      name: "Dettol Liquid Refill Handwash (675ml)",
      category: "Dishwash Liquids",
      img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThY8kwVcYG-76c9t8BiS5rEPJHuq3xOy0rqA&s"
    },
    {
      name: "Harpic Power Plus Toilet Cleaner (1L)",
      category: "Toilet Cleaners",
      img: "https://m.media-amazon.com/images/I/61fQA+kazoL.jpg"
    },
    {
      name: "Colgate Toothbrush (Pack of 4)",
      category: "Oral Care",
      img: "https://rukminim2.flixcart.com/image/850/1000/l01blow0/toothbrush/x/s/e/sensitive-soft-bristles-4-pcs-1-colgate-ultra-soft-original-imagbwthrqebzxjh.jpeg?q=90&crop=false"
    },
    {
      name: "Lizol Floor Cleaner (625ml)",
      category: "Floor Cleaners",
      img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1BTyBQ0jgYNDeYEWQlFdmOSRMc6OAVech1w&s"
    }
  ];

  const cart = {};

  function renderItems() {
    const search = document.getElementById('searchBox').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const list = document.getElementById('productList');
    list.innerHTML = '';

    products.forEach((product, index) => {
      if ((category === "All" || product.category === category) &&
          product.name.toLowerCase().includes(search)) {

        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        itemDiv.innerHTML = `
          <img src="${product.img}" alt="${product.name}">
          <h3>${product.name}</h3>
          <div class="controls" id="controls-${index}">
            <button onclick="addToCart('${index}')">Add to Cart</button>
          </div>
        `;
        list.appendChild(itemDiv);
      }
    });
  }

  function addToCart(index) {
    const name = products[index].name;
    if (!cart[name]) {
      cart[name] = { quantity: 1 };
      document.getElementById('cartBar').style.display = 'block';
    } else {
      cart[name].quantity++;
    }
    updateControls(index);
  }

  function changeQuantity(index, delta) {
    const name = products[index].name;
    if (cart[name]) {
      cart[name].quantity += delta;
      if (cart[name].quantity <= 0) {
        delete cart[name];
      }
      updateControls(index);
    }
    if (Object.keys(cart).length === 0) {
      document.getElementById('cartBar').style.display = 'none';
    }
  }

  function updateControls(index) {
    const name = products[index].name;
    const controls = document.getElementById(`controls-${index}`);
    if (cart[name]) {
      controls.innerHTML = `
        <div class="quantity-controls">
          <button onclick="changeQuantity('${index}', -1)">-</button>
          <span>${cart[name].quantity}</span>
          <button onclick="changeQuantity('${index}', 1)">+</button>
        </div>
      `;
    } else {
      controls.innerHTML = `<button onclick="addToCart('${index}')">Add to Cart</button>`;
    }
  }

  function filterItems() {
    renderItems();
    products.forEach((_, idx) => updateControls(idx));
  }

  function placeOrder() {
    if (Object.keys(cart).length > 0) {
      fetch('https://smart-puzzled-purchase.glitch.me/place-order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(cart)
      })
      .then(response => response.json())
      .then(data => {
        alert('Your order has been placed!');
        for (let key in cart) delete cart[key];
        renderItems();
        document.getElementById('cartBar').style.display = 'none';
      })
      .catch(err => {
        alert('Failed to place order.');
        console.error(err);
      });
    } else {
      alert('Your cart is empty.');
    }
  }

  renderItems();
</script>

</body>
</html>
