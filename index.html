<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog - No Price Shop</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .product {
      background: white;
      padding: 10px;
      border-radius: 8px;
      width: 200px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }
    .cart {
      margin-top: 30px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }
    button {
      padding: 8px 12px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>🛍️ My Catalog</h1>
  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Item 1" />
      <p>Item 1</p>
      <button onclick="addToCart('Item 1')">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Item 2" />
      <p>Item 2</p>
      <button onclick="addToCart('Item 2')">Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Item 3" />
      <p>Item 3</p>
      <button onclick="addToCart('Item 3')">Add to Cart</button>
    </div>
  </div>

  <div class="cart">
    <h2>Your Cart</h2>
    <ul id="cartList"></ul>

    <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST" onsubmit="return prepareOrder()">
      <input type="hidden" name="_subject" value="New Order from Website">
      <input type="hidden" name="order" id="orderField">
      <input type="hidden" name="_captcha" value="false">
      <button type="submit">Place Order</button>
    </form>
  </div>

  <script>
    const cart = [];

    function addToCart(item) {
      cart.push(item);
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const list = document.getElementById('cartList');
      list.innerHTML = "";
      cart.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = `${index + 1}. ${item}`;
        list.appendChild(li);
      });
    }

    function prepareOrder() {
      document.getElementById('orderField').value = cart.join(', ');
      return true;
    }
  </script>
</body>
</html>
