<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .item {
      margin: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      display: inline-block;
      width: 200px;
    }
    .cart {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #000;
      width: 300px;
    }
  </style>
</head>
<body>

<h1>Items for Sale</h1>

<div class="item" id="item1">
  <h3>Dettol Liquid Refill Handwash (675ml)</h3>
  <button onclick="addToCart('Dettol')">Add to Cart</button>
</div>
<div class="item" id="item2">
  <h3>Harpic Power Plus Toilet Cleaner (1L)</h3>
  <button onclick="addToCart('Harpic')">Add to Cart</button>
</div>
<div class="item" id="item3">
  <h3>Colgate Gentle Sensitive Ultra Soft Toothbrush (Pack of 4)</h3>
  <button onclick="addToCart('Colgate')">Add to Cart</button>
</div>
<div class="item" id="item4">
  <h3>Lizol Floor Cleaner (625ml)</h3>
  <button onclick="addToCart('Lizol')">Add to Cart</button>
</div>

<h2>Your Cart</h2>
<div class="cart" id="cart">
  <p>No items in cart yet.</p>
</div>

<script>
  let cart = [];

  function addToCart(item) {
    cart.push(item);
    updateCartDisplay();
  }

  function updateCartDisplay() {
    const cartDiv = document.getElementById('cart');
    if (cart.length === 0) {
      cartDiv.innerHTML = "<p>No items in cart yet.</p>";
    } else {
      cartDiv.innerHTML = "<ul>" + cart.map(item => "<li>" + item + "</li>").join('') + "</ul>";
      // Send the cart details to the Glitch backend
      fetch('https://your-glitch-backend-url.glitch.me/order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ items: cart }),
      })
      .then(response => response.json())
      .then(data => {
        console.log('Order placed successfully:', data);
      })
      .catch(error => {
        console.error('Error placing order:', error);
      });
    }
  }
</script>

</body>
</html>
