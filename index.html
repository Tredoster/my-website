<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      display: flex;
      align-items: center;
    }
    .product img {
      width: 120px;
      height: auto;
      margin-right: 20px;
      border-radius: 8px;
    }
    .product-info {
      flex: 1;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <h1>Available Items</h1>

  <div class="product">
    <img src="https://m.media-amazon.com/images/I/71KcWQyM52L._SX679_.jpg" alt="Dettol Handwash">
    <div class="product-info">
      <h3>Dettol Liquid Refill Handwash (675ml)</h3>
      <form action="https://smart-puzzled-purchase.glitch.me/order" method="POST">
        <input type="hidden" name="item" value="Dettol Liquid Refill Handwash (675ml)">
        <button type="submit">Add to Cart</button>
      </form>
    </div>
  </div>

  <div class="product">
    <img src="https://m.media-amazon.com/images/I/81KFW4qKZsL._SX679_.jpg" alt="Harpic Toilet Cleaner">
    <div class="product-info">
      <h3>Harpic Power Plus Toilet Cleaner (1L)</h3>
      <form action="https://smart-puzzled-purchase.glitch.me/order" method="POST">
        <input type="hidden" name="item" value="Harpic Power Plus Toilet Cleaner (1L)">
        <button type="submit">Add to Cart</button>
      </form>
    </div>
  </div>

  <div class="product">
    <img src="https://m.media-amazon.com/images/I/71rk5UWeDIL._SX679_.jpg" alt="Colgate Toothbrush">
    <div class="product-info">
      <h3>Colgate Gentle Sensitive Ultra Soft Toothbrush (Pack of 4)</h3>
      <form action="https://smart-puzzled-purchase.glitch.me/order" method="POST">
        <input type="hidden" name="item" value="Colgate Gentle Sensitive Ultra Soft Toothbrush (Pack of 4)">
        <button type="submit">Add to Cart</button>
      </form>
    </div>
  </div>

  <div class="product">
    <img src="https://m.media-amazon.com/images/I/71WX4TshM0L._SX679_.jpg" alt="Lizol Floor Cleaner">
    <div class="product-info">
      <h3>Lizol Floor Cleaner (625ml)</h3>
      <form action="https://smart-puzzled-purchase.glitch.me/order" method="POST">
        <input type="hidden" name="item" value="Lizol Floor Cleaner (625ml)">
        <button type="submit">Add to Cart</button>
      </form>
    </div>
  </div>

</body>
</html>
